# Pipeline del microfrontend "agenda" (Angular).
# Solo corre cuando cambia ESTE repo: compila, revisa que exista
# remoteEntry.json y lo publica. El shell no se vuelve a desplegar.
name: Desplegar agenda

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-agenda
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Verificar que el remoto se puede federar
        run: test -f dist/agenda/browser/remoteEntry.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/agenda/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
